<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .hazard-bar {
      width: 100%;
      max-width: 500px;
      height: 24px;
      background: repeating-linear-gradient(
        -45deg,
        #f5b000,
        #f5b000 15px,
        #1a1a1a 15px,
        #1a1a1a 30px
      );
      border: 2px solid #f5b000;
      border-radius: 4px;
      margin: 20px 0;
    }

    .container {
      background: #262626;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      border: 1px solid #333;
    }

    h1 {
      font-size: 2rem;
      color: #f5b000;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    p {
      color: #cccccc;
      margin-top: 10px;
      line-height: 1.5;
    }

    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prism Is Under Construction</h1>
    <div class="hazard-bar"></div>
    <p>We are hard at work building something new. Check back soon! Server: https://discord.gg/5hjeaF3Uj Use at your own risk. Prism is not affiliated with Roblox Corporation. For legal or DMCA inquiries, contact nyxolz@proton.me </p>
    <div id="audioStatus" class="status">Audio status: Starting...</div>
  </div>

  <script>
    let audioCtx = null;
    let ambienceInterval = null;
    let isStarted = false;

    function startAmbience() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Check if the browser allowed audio to run
      if (audioCtx.state === 'running' && !isStarted) {
        isStarted = true;
        document.getElementById('audioStatus').textContent = 'Audio status: Playing site ambience';
        triggerRandomSound();
        ambienceInterval = setInterval(triggerRandomSound, 1400);
        removeUnlockListeners();
      } else if (audioCtx.state === 'suspended') {
        document.getElementById('audioStatus').textContent = 'Audio status: Click or tap anywhere to unmute';
      }
    }

    // 1. Metallic Hammer Strike
    function playHammer() {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);

      playNoiseBurst(0.08, 1200, 0.5);
    }

    // 2. Power Saw Buzz
    function playSaw() {
      const now = audioCtx.currentTime;
      const duration = 0.75;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.linearRampToValueAtTime(240, now + 0.25);
      osc.frequency.linearRampToValueAtTime(160, now + duration);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, now);
      filter.Q.value = 2;

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    }

    // 3. Truck Reversing Beep
    function playBeep() {
      const now = audioCtx.currentTime;
      [0, 0.45].forEach(offset => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(1050, now + offset);

        gain.gain.setValueAtTime(0.15, now + offset);
        gain.gain.setValueAtTime(0.001, now + offset + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + offset);
        osc.stop(now + offset + 0.21);
      });
    }

    // 4. Rapid Jackhammer
    function playJackhammer() {
      const hits = 8;
      for (let i = 0; i < hits; i++) {
        setTimeout(() => {
          if (!audioCtx || audioCtx.state !== 'running') return;
          playNoiseBurst(0.05, 600, 0.45);
        }, i * 65);
      }
    }

    // Helper: Filtered White Noise
    function playNoiseBurst(duration, cutoffFreq, volume) {
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(cutoffFreq, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
    }

    function triggerRandomSound() {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const sounds = [playHammer, playHammer, playSaw, playBeep, playJackhammer];
      const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
      randomSound();
    }

    // Unlock audio on the very first interaction anywhere on the page
    function unlockAudio() {
      startAmbience();
    }

    function removeUnlockListeners() {
      ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(event => {
        document.removeEventListener(event, unlockAudio);
      });
    }

    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(event => {
      document.addEventListener(event, unlockAudio);
    });

    // Attempt immediate autoplay as soon as the page loads
    window.addEventListener('load', startAmbience);
  </script>
</body>
</html>
